name: evals

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline (fake LLM, deterministic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/ingest/requirements.txt
      - run: pip install -r backend/requirements.txt -r backend/ingest/requirements.txt
      - run: ./run_evals.sh offline

  live-decisions:
    name: Decisions (real model, exact assertions)
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
    steps:
      - name: Check model credentials
        id: creds
        run: |
          if [ -z "$OPENROUTER_API_KEY" ] || [ -z "$OPENROUTER_MODEL" ]; then
            echo "::warning::Set the OPENROUTER_API_KEY secret and OPENROUTER_MODEL variable to run decision evals."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.creds.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/ingest/requirements.txt
      - if: steps.creds.outputs.ok == 'true'
        run: pip install -r backend/requirements.txt -r backend/ingest/requirements.txt
      - if: steps.creds.outputs.ok == 'true'
        run: ./run_evals.sh live -rxX
