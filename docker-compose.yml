x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SIGNAL_DATA_DIR: /app/data
    logging: *default-logging
    networks:
      - signal-network
      - supabase_default   # reach the Supabase Postgres as `db:5432`
    ports:
      - "8001:8001"
    volumes:
      - signal-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  signal-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AGUI_AGENT_URL: /api/agent
        NEXT_PUBLIC_APP_ENV: development
    env_file:
      - .env
    environment:
      SIGNAL_BACKEND_URL: http://backend:8001
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - signal-network
      - tvbox_default
    ports:
      - "5173:5173"

volumes:
  signal-data:

networks:
  signal-network:
    name: signal-network
  tvbox_default:
    external: true
  supabase_default:
    external: true
