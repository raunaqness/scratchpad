services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SIGNAL_DATA_DIR: /app/data
    networks:
      - signal-network
    ports:
      - "8001:8001"
    volumes:
      - signal-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  signal-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AGUI_AGENT_URL: /agent
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - signal-network
      - tvbox_default
    ports:
      - "5173:5173"

volumes:
  signal-data:

networks:
  signal-network:
    name: signal-network
  tvbox_default:
    external: true
