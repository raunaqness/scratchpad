services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SIGNAL_DATA_DIR: /app/data
    ports:
      - "8001:8001"
    volumes:
      - signal-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AGUI_AGENT_URL: http://localhost:8001/agent
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  signal-data:
